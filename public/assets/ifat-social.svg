<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">ifat. — Graphic design. A clear point of view.</title>
  <desc id="description">A portfolio concept brand card for Ifat Ibrahim, with an ink wordmark, green dot, and the website's paired geometric identity mark on a green artboard. The background is warm off-white.</desc>
  <metadata>1200 × 630. Palette: paper #F2F0EF; green #25A36F; ink #10251E. Wordmark: local Studio Sans / Noto Sans Display Bold, 340px, tracking -0.09em. Subtitle and status: local Noto Sans Display Regular. Text is outlined for deterministic rendering; edit copy and layout in scripts/build-social.mjs. Identity geometry is reused from the existing website identity study; no client-project imagery is included.</metadata>
